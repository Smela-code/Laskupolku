  --apple:#F0553F; --orange:#FF9C30; --pear:#9CCB3A; --berry:#F04C73; --leaf:#4FB04A; --stem:#B98557; --seed:#FFE7A0;
  --cake:#E37BA6; --cake-edge:#B4527D; --plate:#26324F; color-scheme:dark;
  --coin:#F2C14A; --coin-edge:#6B4A06; --note:#3FAE6B; --glass:#62C0D8; --candy:#B278E6; --blk:#5B8DF0; --blk2:#86AAF5;
}}

*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

.spin{width:150px;height:auto;display:block}
.dice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.die{width:44px;height:44px;display:block}
.die3d{width:96px;height:auto;display:block}
.cchip{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:6px;vertical-align:-3px;border:1px solid var(--line)}
.stab{border-collapse:collapse;margin:6px auto;background:var(--paper);font:800 .95rem var(--display);font-variant-numeric:tabular-nums}
.stab th,.stab td{border:1px solid var(--line);width:34px;height:30px;text-align:center;padding:2px}
.stab th .die{width:22px;height:22px;margin:auto}
.stab td.hl{background:var(--sun);color:#1C2742}
.sim{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.simbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.simbtns .btn{font-size:.95rem;padding:7px 12px}
.simbars{display:flex;align-items:flex-end;gap:4px;height:130px;width:100%;max-width:440px}
.sb{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.sbv{width:100%;background:var(--blue);border-radius:4px 4px 0 0;transition:height .25s ease-out;min-height:2px}
#simdice.shake svg{animation:dshake .17s linear infinite}
@keyframes dshake{0%{transform:rotate(-12deg) translateY(-2px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-2px)}}
.simbtns .btn:disabled{opacity:.5;cursor:default}
.sbn{font-size:.72rem;font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.sbl{font:800 .85rem var(--display)}
.ball{width:28px;height:28px;display:block}
.pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.pchip{display:inline-flex;gap:2px;padding:4px 6px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.pchip .ball{width:20px;height:20px}
.pchip.hl{border-color:var(--good);background:var(--good-bg)}
.sb.full .sbv{background:repeating-linear-gradient(0deg,var(--blue) 0 8px,color-mix(in srgb,var(--blue) 70%,var(--paper)) 8px 10px)}
.sb{position:relative}
.burst{position:absolute;left:50%;top:14px;width:0;height:0;pointer-events:none;z-index:3}
.burst i{position:absolute;left:0;top:0;animation:fly .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 30px)) rotate(var(--r)) scale(1);opacity:0}}
.pum{position:absolute;left:0;top:-14px;transform:translate(-50%,-50%);font:800 1rem var(--display);color:var(--apple);white-space:nowrap;animation:pum .9s ease-out forwards}
@keyframes pum{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}25%{transform:translate(-50%,-60%) scale(1.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
.sb.hit .sbv{animation:hit .35s ease-out}
@keyframes hit{0%{filter:brightness(1.8)}100%{filter:none}}
.simbars{overflow:visible}
.simcap{display:inline-block}
.simcap.grow{animation:capgrow .8s ease-out}
@keyframes capgrow{0%{transform:scale(1)}30%{transform:scale(1.6)}100%{transform:scale(1)}}
.sbl2{font:700 .72rem var(--body);text-align:center;line-height:1.15}
.simnote{margin:0;font-size:.82rem;color:var(--soft)}
.simtot{margin:0;color:var(--soft);font-weight:700;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.sbv{transition:none}}
.kseq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kseq{flex-wrap:nowrap}
.ktile{flex:1 1 0;min-width:0;max-width:66px;aspect-ratio:1;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px}
.ktile svg{width:85%;height:auto;display:block}
.kopt svg{width:100%;height:auto;display:block}
.choices.pics{display:grid;grid-template-columns:repeat(4,minmax(0,84px));gap:8px}
.choices.pics .choice{min-width:0;padding:6px;aspect-ratio:1}
.ktile.q2{border:3px dashed var(--blue);color:var(--blue);font:800 1.8rem var(--display)}
.ktile.ans{border:3px solid var(--good)}
.kopt{display:block}
.seq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.stile{min-width:52px;padding:8px 10px;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.stile.q2{border:3px dashed var(--blue);color:var(--blue)}
.sdiff{font:800 .95rem var(--display);color:var(--sun);background:var(--paper);border-radius:6px;padding:0 4px}
.key.wide{grid-column:1/-1;height:48px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px;margin:0 auto;background:var(--paper);padding:8px;border-radius:16px;border:1px solid var(--line)}
.key{height:58px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:800 1.8rem var(--display);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.key:active{background:var(--chip);transform:translateY(1px)}
.key.alt{background:var(--chip)}
@media (min-width:600px){.key{height:64px}}
footer{color:var(--soft);font-size:.88rem;max-width:65ch}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.stars.pop{animation:none}}
@media (max-width:420px){.grade b{font-size:1.45rem}.group{grid-template-columns:repeat(5,26px)}.fr{width:26px;height:26px}.cake{width:64px;height:64px}}
/* pylväsdiagrammi y-akselilla */
.simbars{display:flex;align-items:stretch;gap:4px;height:auto;padding-top:18px}
.sb{height:auto;justify-content:flex-start;gap:3px}
.sbw{position:relative;display:block;width:100%;height:112px}
.sb .sbv{position:absolute;left:0;right:0;bottom:0;width:auto}
.sb .sbn{position:absolute;left:0;right:0;bottom:2px;text-align:center;transition:bottom .25s ease-out}
.burst{top:0}
.yax{flex:0 0 30px;display:flex;flex-direction:column}
.yax .sbw{border-right:2px solid var(--soft)}
.ytick{position:absolute;right:7px;font:800 .75rem var(--body);color:var(--soft);line-height:1;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.ytick::after{content:"";position:absolute;right:-9px;top:50%;width:7px;height:2px;background:var(--soft)}
.ytick.simcap{top:0}
.ytick.y0{top:100%}
@media (prefers-reduced-motion:reduce){.sb .sbn{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Laskupolku <span class="opsrow" aria-hidden="true"><span class="o1">+</span><span class="o2">−</span><span class="o3">·</span><span class="o4">:</span></span></h1>
      <p class="sub">Yhteen-, vähennys-, kerto- ja jakolaskua kuvien avulla 1.–6. luokalle. Mukana myös kellolaskut ja kuvapulmat.</p>
    </div>
    <div class="stars" id="stars" aria-label="Tähdet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="var(--sun)" stroke="var(--stem)" stroke-width=".8"/></svg>
      <span id="starN">0</span>
    </div>
  </header>

  <section>
    <p class="lbl">Luokka</p>
    <div class="grades" id="grades"></div>
  </section>

  <p class="goal" id="goal"></p>

  <section class="controls">
    <div><label class="lbl" for="ops">Lasku</label><select class="sel" id="ops" data-sel="op"></select></div>
    <div id="topicBox"><label class="lbl" for="topics">Aihe</label><select class="sel" id="topics" data-sel="topic"></select></div>
    <div id="typeBox"><label class="lbl" for="types">Tyyppi</label><select class="sel" id="types" data-sel="type"></select></div>
  </section>

  <section class="sheet" id="sheet" aria-live="polite"></section>

  <footer>
    <p>Kolme oikeaa vastausta peräkkäin nostaa tasoa. Kaksi hankalaa tehtävää peräkkäin laskee sitä. Tason voi valita myös itse. Edistyminen tallentuu tähän selaimeen.</p>
  </footer>
</div>

<script>
/* ---------- apuvälineet ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const OPS={'+':'+','-':'−'};
const fmtInt=n=>{const s=String(n);return n>=10000?s.replace(/\B(?=(\d{3})+(?!\d))/g,' '):s};
const fd=x=>{if(!x.d)return fmtInt(x.u);const s=String(x.u).padStart(x.d+1,'0');return fmtInt(+s.slice(0,-x.d))+','+s.slice(-x.d)};
const val=x=>x.u/10**x.d;
const frac=(n,d)=>`<span class="q"><span>${n}</span><span>${d}</span></span>`;
const BOX='<span class="box">?</span>';

const KIDS=[{n:'Aino',ll:'Ainolla'},{n:'Eetu',ll:'Eetulla'},{n:'Siiri',ll:'Siirillä'},{n:'Leo',ll:'Leolla'},{n:'Venla',ll:'Venlalla'},{n:'Onni',ll:'Onnilla'},{n:'Helmi',ll:'Helmillä'},{n:'Elias',ll:'Eliaksella'},{n:'Lilja',ll:'Liljalla'},{n:'Väinö',ll:'Väinöllä'}];
const two=()=>{const s=shuffle(KIDS);return [s[0],s[1]]};

/* ---------- hedelmät ---------- */
const FRUITS={
  omena:{nom:'omena',part:'omenaa',svg:'<circle cx="12" cy="14" r="8" fill="var(--apple)"/><path d="M12 6.5C12 4.5 13 3.2 14.2 2.2" stroke="var(--stem)" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="16" cy="4.6" rx="3" ry="1.5" transform="rotate(-25 16 4.6)" fill="var(--leaf)"/><circle cx="9" cy="11" r="2" fill="#fff" opacity=".35"/>'},
  paaryna:{nom:'päärynä',part:'päärynää',svg:'<circle cx="12" cy="16" r="6.6" fill="var(--pear)"/><circle cx="12" cy="9.6" r="4.3" fill="var(--pear)"/><path d="M12 5.6L12.9 2.6" stroke="var(--stem)" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="15.3" cy="4" rx="2.4" ry="1.2" transform="rotate(-20 15.3 4)" fill="var(--leaf)"/><circle cx="9.6" cy="14" r="1.6" fill="#fff" opacity=".35"/>'},
  appelsiini:{nom:'appelsiini',part:'appelsiinia',svg:'<circle cx="12" cy="13.5" r="8.4" fill="var(--orange)"/><ellipse cx="13.5" cy="4.6" rx="2.8" ry="1.4" transform="rotate(-15 13.5 4.6)" fill="var(--leaf)"/><circle cx="12" cy="6.2" r=".9" fill="var(--stem)"/><circle cx="9" cy="10.5" r="1.8" fill="#fff" opacity=".35"/><circle cx="15" cy="16" r=".5" fill="var(--stem)" opacity=".4"/><circle cx="9.5" cy="17" r=".5" fill="var(--stem)" opacity=".4"/>'},
  mansikka:{nom:'mansikka',part:'mansikkaa',svg:'<path d="M12 22C6.6 18 4.6 12.6 6.5 9.2 8 7.2 16 7.2 17.5 9.2 19.4 12.6 17.4 18 12 22Z" fill="var(--berry)"/><path d="M6.8 8.8L9.4 7.3 10.4 5 12 6.6 13.6 5 14.6 7.3 17.2 8.8Z" fill="var(--leaf)"/><circle cx="9.4" cy="12" r=".7" fill="var(--seed)"/><circle cx="14.6" cy="12" r=".7" fill="var(--seed)"/><circle cx="12" cy="14.6" r=".7" fill="var(--seed)"/><circle cx="9.8" cy="16.6" r=".7" fill="var(--seed)"/><circle cx="14.2" cy="16.6" r=".7" fill="var(--seed)"/>'}
};
const FK=Object.keys(FRUITS);
const pf=(n,t)=>n===1?t.nom:t.part;
function fruitSVG(t,s){
  if(s==='e')return '<svg class="fr" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 3"/></svg>';
  return `<svg class="fr ${s==='x'?'x':''}" viewBox="0 0 24 24" aria-hidden="true">${FRUITS[t].svg}${s==='x'?'<path d="M5 5L19 21M19 5L5 21" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>':''}</svg>`;
}
const many=(t,n,s='n')=>Array.from({length:Math.max(0,n)},()=>({t,s}));
const group=(items,label)=>`<div class="group" role="img" aria-label="${label}">${items.map(i=>fruitSVG(i.t,i.s)).join('')}</div>`;
const sign=op=>`<span class="sign">${OPS[op]||op}</span>`;

/* ---------- kympit ja sadat ---------- */
function pv(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10;let s='<div class="pv">';
  if(h)s+=`<div class="pvh">${'<span class="pal"></span>'.repeat(h)}</div>`;
  if(t)s+=`<div class="pvt">${'<span class="rod"></span>'.repeat(t)}</div>`;
  if(o)s+=`<div class="pvo">${'<span class="dot"></span>'.repeat(o)}</div>`;
  return s+'</div>'}
const opnd=(inner,cap,label)=>`<figure class="opnd" role="img" aria-label="${label}">${inner}<figcaption>${cap}</figcaption></figure>`;
const legend=h=>`<p class="legend"><span><i class="dot"></i> 1 omena</span><span><i class="rod"></i> laatikko = 10</span>${h?'<span><i class="pal"></i> lava = 100</span>':''}</p>`;

/* ---------- laskettavat esineet (2. luokan sanalliset) ---------- */
const NUMTXT=(x,y,s,c)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${s}" font-weight="800" fill="${c}" font-family="Baloo 2, Trebuchet MS, sans-serif">`;
const STAR=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="var(--sun)" stroke="var(--coin-edge)" stroke-width="1"/>`;
const UNITS={
  euro:{word:'euroa',l1:'1 € kolikko',l10:'10 € seteli',
    one:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--coin)" stroke="var(--coin-edge)" stroke-width="1.6"/>${NUMTXT(12,16.5,12,'var(--coin-edge)')}1</text></svg>`,
    ten:`<svg viewBox="0 0 20 34" aria-hidden="true"><rect x="1" y="1" width="18" height="32" rx="2" fill="var(--note)"/><rect x="3.5" y="3.5" width="13" height="27" rx="1" fill="none" stroke="#fff" stroke-opacity=".6"/>${NUMTXT(10,20,9,'#fff')}10</text></svg>`},
  pullo:{word:'pulloa',l1:'1 pullo',l10:'kori = 10 pulloa',
    one:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5h4v3l2 3v11a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 8 20.5v-11l2-3z" fill="var(--glass)"/><rect x="9.6" y="1.5" width="4.8" height="2.6" rx=".6" fill="var(--blue)"/><rect x="9.6" y="12" width="4.8" height="5" fill="#fff" opacity=".55"/></svg>',
    ten:`<svg viewBox="0 0 20 34" aria-hidden="true"><rect x="1" y="1" width="18" height="32" rx="2" fill="var(--stem)"/>${[0,1,2,3,4].map(i=>`<circle cx="6" cy="${5.5+5.8*i}" r="2.5" fill="var(--glass)"/><circle cx="14" cy="${5.5+5.8*i}" r="2.5" fill="var(--glass)"/>`).join('')}</svg>`},
  karkki:{word:'karkkia',l1:'1 karkki',l10:'pussi = 10 karkkia',
    one:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7l6 3.5v3L2 17zM22 7l-6 3.5v3l6 3.5z" fill="var(--candy)" opacity=".65"/><circle cx="12" cy="12" r="5.5" fill="var(--candy)"/><path d="M9.3 10.3c1.6-1.6 3.8-1.6 5.4 0" stroke="#fff" stroke-width="1.3" fill="none" opacity=".75"/></svg>',
    ten:`<svg viewBox="0 0 20 34" aria-hidden="true"><path d="M6 4.2c1.2-1.4 2.6-.6 4-.6s2.8-.8 4 .6l-1.6 4h-4.8z" fill="var(--candy)" opacity=".65"/><path d="M8.2 9.6C5.5 12 .9 18 .6 25.5.4 31.2 3.5 33.4 10 33.4s9.6-2.2 9.4-7.9C19.1 18 14.5 12 11.8 9.6z" fill="var(--candy)"/><rect x="6.6" y="7.6" width="6.8" height="2.6" rx="1.2" fill="var(--sun)"/><circle cx="10" cy="24.6" r="6.2" fill="#fff"/>${NUMTXT(10,27.9,8.5,'var(--candy)')}10</text><path d="M3.2 21c.7-2.6 1.9-4.8 3.6-6.4" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".6"/></svg>`},
  tarra:{word:'tarraa',l1:'1 tarra',l10:'arkki = 10 tarraa',
    one:`<svg viewBox="0 0 24 24" aria-hidden="true">${STAR(0,0,1)}</svg>`,
    ten:`<svg viewBox="0 0 20 34" aria-hidden="true"><rect x="1" y="1" width="18" height="32" rx="2" fill="var(--paper)" stroke="var(--soft)" stroke-width="1.2"/>${[0,1,2,3,4].map(i=>STAR(2.4,2.6+5.9*i,.26)+STAR(10.4,2.6+5.9*i,.26)).join('')}</svg>`},
  sivu:{word:'sivua',l1:'1 sivu',l10:'nippu = 10 sivua',
    one:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h10l4 4v16H5z" fill="var(--paper)" stroke="var(--soft)" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 2v4h4" fill="none" stroke="var(--soft)" stroke-width="1.5"/><path d="M8 10h8M8 13.5h8M8 17h5" stroke="var(--soft)" stroke-width="1.3" opacity=".6"/></svg>',
    ten:`<svg viewBox="0 0 20 34" aria-hidden="true"><rect x="4" y="4" width="15" height="29" rx="1" fill="var(--paper)" stroke="var(--soft)"/><rect x="2.5" y="2.5" width="15" height="29" rx="1" fill="var(--paper)" stroke="var(--soft)"/><rect x="1" y="1" width="15" height="29" rx="1" fill="var(--paper)" stroke="var(--soft)"/>${NUMTXT(8.5,19,8,'var(--soft)')}10</text></svg>`}
};
function pvT(n,th){const U=UNITS[th],t=Math.floor(n/10),o=n%10;
  return `<div class="pv">${t?`<div class="pvt u">${U.ten.repeat(t)}</div>`:''}${o?`<div class="pvo u">${U.one.repeat(o)}</div>`:''}</div>`}
const legendT=th=>{const U=UNITS[th];return `<p class="legend"><span>${U.one} ${U.l1}</span><span class="t">${U.ten} ${U.l10}</span></p>`};

/* ---------- sanallisten tehtävien kuvat ---------- */
const ICON={
  kirjat:'<svg viewBox="0 0 48 48"><rect x="6" y="10" width="8" height="28" rx="1.5" fill="var(--apple)"/><rect x="15" y="14" width="8" height="24" rx="1.5" fill="var(--blue)"/><rect x="24" y="7" width="7" height="31" rx="1.5" fill="var(--pear)"/><rect x="33" y="12" width="8" height="26" rx="1.5" transform="rotate(10 37 25)" fill="var(--sun)"/><path d="M8 15h4M17 19h4M26 12h3" stroke="#fff" stroke-width="2" opacity=".7"/><rect x="3" y="38" width="42" height="4" rx="1" fill="var(--stem)"/></svg>',
  pokaali:'<svg viewBox="0 0 48 48"><path d="M15 8h18v9a9 9 0 0 1-18 0z" fill="var(--sun)"/><path d="M15 11H9a6 6 0 0 0 7 8M33 11h6a6 6 0 0 1-7 8" fill="none" stroke="var(--sun)" stroke-width="3"/><rect x="21" y="25" width="6" height="7" fill="var(--sun)"/><rect x="14" y="32" width="20" height="7" rx="1.5" fill="var(--stem)"/><path d="M24 10.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff" opacity=".85"/></svg>',
  auto:'<svg viewBox="0 0 48 48"><path d="M5 31v-7l6-10h21l8 10h3v7z" fill="var(--blue)"/><path d="M13 16h7v8H9zM23 16h8l6 8H23z" fill="var(--paper)" opacity=".85"/><circle cx="14" cy="32" r="5" fill="var(--ink)"/><circle cx="35" cy="32" r="5" fill="var(--ink)"/><circle cx="14" cy="32" r="2" fill="var(--line)"/><circle cx="35" cy="32" r="2" fill="var(--line)"/><path d="M4 41h40" stroke="var(--soft)" stroke-width="2" stroke-dasharray="6 4"/></svg>',

/* ---------- kakut ---------- */
function cakeSVG(n,k){const S=76,c=S/2,r=c-3;let p='';
  if(n===1)p=`<circle cx="${c}" cy="${c}" r="${r}" fill="${k?'var(--cake)':'var(--plate)'}"/>`;
  else for(let i=0;i<n;i++){const a0=(-90+360*i/n)*Math.PI/180,a1=(-90+360*(i+1)/n)*Math.PI/180;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    p+=`<path d="M${c} ${c}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${360/n>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${i<k?'var(--cake)':'var(--plate)'}" stroke="var(--paper)" stroke-width="2"/>`}
  return `<svg class="cake" viewBox="0 0 ${S} ${S}" aria-hidden="true">${p}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--cake-edge)" stroke-width="2"/></svg>`}
function cakes(n,d){const cnt=Math.max(1,Math.ceil(n/d));let s='<div class="cakes">';for(let i=0;i<cnt;i++)s+=cakeSVG(d,Math.min(d,Math.max(0,n-i*d)));return s+'</div>'}
const fracOp=(n,d)=>opnd(cakes(n,d),frac(n,d),`${n}/${d}`);

/* ---------- vihjeiden apu ---------- */
function splitHint(a,b,op,base){
  const nm=base===10?['kymmenet','ykköset']:['sadat','kympit'];
  const aH=Math.floor(a/base)*base,aL=a%base,bH=Math.floor(b/base)*base,bL=b%base;
  if(op==='+')return `<p>Laske ensin ${nm[0]} yhteen: ${aH} + ${bH} = ${aH+bH}.</p><p>Sitten ${nm[1]}: ${aL} + ${bL} = ${aL+bL}.</p><p>Lopuksi lasketaan ${aH+bH} + ${aL+bL}.</p>`;
  let s='';const m=a-bH;
  if(bH)s+=`<p>Vähennä ensin ${nm[0]}: ${a} − ${bH} = ${m}.</p>`;
  if(bL){const r=m%base;
    if(r&&r<bL)s+=`<p>Sitten ${bL} pois. Vähennä ensin ${r}, niin pääset lukuun ${m-r}. Vähennä sen jälkeen loput ${bL-r}.</p>`;
    else s+=`<p>Sitten ${nm[1]}: ${m} − ${bL} = ?</p>`;}
  return s}

/* ---------- allekkainlasku ---------- */
const PLACE={6:'Miljoonat',5:'Satatuhannet',4:'Kymmenettuhannet',3:'Tuhannet',2:'Sadat',1:'Kymmenet',0:'Ykköset','-1':'Kymmenesosat','-2':'Sadasosat','-3':'Tuhannesosat'};
function countCarry(a,b,op){let c=0,k=0;while(a>0||b>0){const da=a%10,db=b%10;
  if(op==='+'){if(da+db+k>=10){c++;k=1}else k=0}else{if(da-k<db){c++;k=1}else k=0}
  a=Math.floor(a/10);b=Math.floor(b/10)}return c}
function buildCol(n,mode,op){
  for(let tries=0;tries<60;tries++){
    const cand=[...Array(n-1).keys()];const want=new Set();
    if(mode===1)want.add(pick(cand));
    if(mode===2)shuffle(cand).slice(0,Math.min(cand.length,R(2,Math.max(2,cand.length)))).forEach(p=>want.add(p));
    let A=0,B=0,k=0,p10=1;
    for(let i=0;i<n;i++){const top=i===n-1,w=want.has(i);let da=0,db=0;
      for(let t=0;t<200;t++){da=R(top?1:0,9);db=R(0,9);
        if(op==='+'){const s=da+db+k;if(w?s>=10:s<=9)break}
        else{const e=da-k;if(w?e<db:e>=db)break}}
      A+=da*p10;B+=db*p10;k=w?1:0;p10*=10}
    const ok=mode===0?countCarry(A,B,op)===0:mode===1?countCarry(A,B,op)===1:countCarry(A,B,op)>=2;
    if(ok&&B>0&&(op==='+'||A>B))return [A,B]}
  return op==='+'?[R(10**(n-1),5*10**(n-1)),R(10**(n-2),4*10**(n-1))]:[R(6*10**(n-1),10**n-1),R(10**(n-2),5*10**(n-1))]}
function digitsOf(x){const s=String(x.u).padStart(x.d+1,'0');return{int:x.d?s.slice(0,-x.d):s,dec:x.d?s.slice(-x.d):'',d:x.d}}
function colLayout(A,B,op){
  const D=Math.max(A.d,B.d),sc=x=>x.u*10**(D-x.d);
  const ansU=op==='+'?sc(A)+sc(B):sc(A)-sc(B);
  const pa=digitsOf(A),pb=digitsOf(B),pr=digitsOf({u:ansU,d:D});
  const I=Math.max(pa.int.length,pb.int.length,pr.int.length);
  const row=p=>{const c=p.int.padStart(I,' ').split('');if(D){c.push(p.d?',':'');c.push(...p.dec.padEnd(D,' ').split(''))}return c.map(x=>x===' '?'':x)};
  return{D,I,a:row(pa),b:row(pb),r:row(pr),ansU,N:I+(D?D+1:0)}}
function colSteps(L,op){
  const out=[],carries=[];let k=0;
  const isC=i=>L.D&&i===L.I;
  const leftOf=i=>{let j=i-1;if(isC(j))j--;return j};
  for(let i=L.N-1;i>=0;i--){if(isC(i))continue;
    const ca=L.a[i],cb=L.b[i];if(ca===''&&cb===''&&k===0)continue;
    const exp=i<L.I?L.I-1-i:-(i-L.I),name=PLACE[exp]||'';
    const da=+(ca||0),db=+(cb||0);
    const z=(exp<0&&(ca===''||cb===''))?' Tyhjän paikan voi ajatella nollaksi.':'';
    if(op==='+'){const s=da+db+k;
      if(ca===''&&cb===''){out.push(`<li><b>${name}:</b> muistinumero 1 kirjoitetaan vastaukseen.</li>`);k=0;continue}
      out.push(`<li><b>${name}:</b> ${da} + ${db}${k?' + 1':''} = ${s}.${s>=10?` Kirjoita ${s%10} ja merkitse muistiin 1.`:''}${z}</li>`);
      if(s>=10)carries.push(leftOf(i));k=s>=10?1:0}
    else{
      if(k&&da===0){out.push(`<li><b>${name}:</b> tässä on 0, josta on jo lainattu. Lainataan vasemmalta, jolloin siitä tulee 10 − 1 = 9. Sitten 9 − ${db} = ${9-db}.${z}</li>`);k=1;continue}
      const e=da-k,pre=k?`${da} − 1 (lainattu) = ${e}. `:'';
      if(e<db){out.push(`<li><b>${name}:</b> ${pre}${e} − ${db} ei onnistu, joten lainataan 1 vasemmalta: ${e+10} − ${db} = ${e+10-db}.${z}</li>`);k=1}
      else{out.push(`<li><b>${name}:</b> ${pre}${e} − ${db} = ${e-db}.${z}</li>`);k=0}}}
  if(op==='+'&&k)out.push('<li>Muistinumero 1 kirjoitetaan vastaukseen vasemmalle.</li>');
  return{out,carries}}

function wordInt(a,b,op){const[K,M]=two();const mx=Math.max(a,b);
  const w=pick((op==='+'?W_IA:W_IS).filter(w=>mx<=(w.max||Infinity)&&mx>=(w.min||0)));

const W_DA=[

  {ok:()=>true,unit:'km',icon:'pyora',t:(A,B)=>`Pyöräretken ensimmäinen osuus oli ${fd(A)} km ja toinen osuus ${fd(B)} km. Kuinka pitkä retki oli yhteensä?`},
  {ok:(A,B)=>val(A)<20&&val(B)<20,unit:'kg',icon:'sakki',t:(A,B)=>`Leipomoon tuodaan ${fd(A)} kg jauhoja ja ${fd(B)} kg sokeria. Montako kiloa niitä on yhteensä?`}];
const W_DS=[
  {ok:(A,B)=>(A.d===2||A.d===0)&&B.d===2&&val(A)<=100,unit:'€',icon:'kolikot',t:(A,B,K)=>`${K.ll} on ${fd(A)} €. Hän ostaa ${pick(ITEMS)} hintaan ${fd(B)} €. Paljonko rahaa jää?`},

  {ok:(A,B)=>val(A)<7,unit:'m',icon:'mitta',t:(A,B,K,M)=>`${K.n} hyppäsi pituutta ${fd(A)} m ja ${M.n} ${fd(B)} m. Kuinka monta metriä pidemmälle ${K.n} hyppäsi?`}];
function wordDec(A,B,op){const[K,M]=two();const w=pick((op==='+'?W_DA:W_DS).filter(w=>w.ok(A,B)));return{text:w.t(A,B,K,M),unit:w.unit,icon:ICON[w.icon]}}

/* ---------- tehtävien rakentajat ---------- */
function intProblem({a,b,op,visual,text,story,hint,word,storyIcon}){
  const ans=op==='+'?a+b:a-b;
  return{kind:'int',visual,text,story,storyIcon,ans,answerText:fmtInt(ans),hint,
    explain:`<p><b>${fmtInt(a)} ${OPS[op]} ${fmtInt(b)} = ${fmtInt(ans)}</b></p>`,unit:word&&word.unit}}
function colProblem(A,B,op,word){
  if(op==='-'){if(val(A)<val(B))[A,B]=[B,A];if(val(A)===val(B))A={u:A.u+1,d:A.d}}
  const L=colLayout(A,B,op),{out,carries}=colSteps(L,op);
  const ansText=fd({u:L.ansU,d:L.D}),expr=`${fd(A)} ${OPS[op]} ${fd(B)}`;
  const dec=A.d||B.d,align=A.d!==B.d?'<p>Muista kirjoittaa pilkut allekkain.</p>':'';
  const explain=`<p><b>${expr} = ${ansText}</b></p><ol>${out.join('')}</ol>`;
  if(word){const w=dec?wordDec(A,B,op):wordInt(A.u,B.u,op);
    return{kind:dec?'dec':'int',story:w.text,storyIcon:w.icon,unit:w.unit,ans:L.ansU/10**L.D,answerText:ansText+(w.unit?' '+w.unit:''),
      hint:`<p>${op==='+'?'Tässä lasketaan yhteen':'Tässä lasketaan vähennyslasku'}: <b>${expr}</b>.</p><p>Laske allekkain paperille. Aloita oikealta.</p>${align}`,explain}}
  return{kind:'col',L,op,carries,ans:L.ansU,answerText:ansText,
    hint:`<p>Aloita oikealta ja etene vasemmalle.</p>${align}<ol>${out[0]}</ol><p>Jatka samalla tavalla seuraavaan sarakkeeseen.</p>`,explain}}
function fracProblem(n1,d1,n2,d2,op,word,kind){
  const D=lcm(d1,d2),k1=D/d1,k2=D/d2,N=op==='+'?n1*k1+n2*k2:n1*k1-n2*k2,g=gcd(N,D);
  const visual=`${fracOp(n1,d1)}${sign(op)}${fracOp(n2,d2)}`;
  let hint;
  if(d1===d2)hint=`<p>Nimittäjät ovat samat (${d1}), joten palat ovat samankokoisia. Laske vain osoittajat: ${n1} ${OPS[op]} ${n2}. Nimittäjä pysyy samana.</p>`;
  else if(k1===1||k2===1){const[sn,sd,sk]=k1===1?[n2,d2,k2]:[n1,d1,k1];
    hint=`<p>Palat ovat erikokoisia. Lavenna ${frac(sn,sd)} niin, että nimittäjä on ${D}: kerro osoittaja ja nimittäjä luvulla ${sk}.</p><div class="visual">${fracOp(sn,sd)}<span class="sign">=</span>${fracOp(sn*sk,D)}</div><p>Nyt palat ovat samankokoisia, ja voit laskea osoittajat.</p>`}
  else hint=`<p>Etsi yhteinen nimittäjä. Pienin luku, joka jakautuu tasan sekä luvulla ${d1} että luvulla ${d2}, on ${D}.</p><div class="visual">${fracOp(n1*k1,D)}${sign(op)}${fracOp(n2*k2,D)}</div><p>${frac(n1,d1)} = ${frac(n1*k1,D)} ja ${frac(n2,d2)} = ${frac(n2*k2,D)}. Laske nyt osoittajat.</p>`;
  let res=frac(N,D);if(g>1)res+=` = ${frac(N/g,D/g)}`;
  const nn=N/g,dd=D/g;if(nn>dd&&dd>1)res+=` eli ${Math.floor(nn/dd)} ja ${frac(nn%dd,dd)}`;if(dd===1)res+=` eli ${nn}`;
  const mid=d1!==d2?` = ${frac(n1*k1,D)} ${OPS[op]} ${frac(n2*k2,D)}`:'';
  const explain=`<p><b>${frac(n1,d1)} ${OPS[op]} ${frac(n2,d2)}${mid} = ${res}</b></p><div class="visual">${cakes(N,D)}</div><p>Myös supistettu tai laventamaton muoto hyväksytään.</p>`;
  const P={kind:'frac',visual,ans:{n:N,d:D},answerText:frac(N,D)+(g>1?` = ${frac(N/g,D/g)}`:''),hint,explain};
  if(word){const[K,M]=two();const over=op==='+'?N>D:n1>d1;const f1=frac(n1,d1),f2=frac(n2,d2);
    P.story=op==='+'?(over?`Mustikkapiirakkaa syötiin perjantaina ${f1} piirakkaa ja lauantaina ${f2} piirakkaa. Kuinka paljon piirakkaa syötiin yhteensä?`:`${K.n} söi kakusta ${f1} ja ${M.n} ${f2}. Kuinka suuren osan kakusta he söivät yhteensä?`)
      :(over?`Mustikkapiirakkaa oli jäljellä ${f1} piirakkaa. Vieraat söivät siitä ${f2}. Kuinka paljon piirakkaa jäi?`:`Kakusta oli jäljellä ${f1}. ${K.n} söi siitä ${f2}. Kuinka suuri osa kakusta jäi?`)}
  else P.text=`${frac(n1,d1)} ${OPS[op]} ${frac(n2,d2)} = ${BOX}`;
  return P}

/* ---------- 1. luokka ---------- */
function g1Fruit(L,op,word){

  if(op==='+'){if(L===1){a=R(1,8);b=R(1,10-a)}else if(L===2){const x=R(0,8);a=10+x;b=R(1,9-x);if(Math.random()<.4)[a,b]=[b,a]}else{a=R(3,9);b=R(11-a,9)}}
  else{if(L===1){a=R(3,10);b=R(1,a-1)}else if(L===2){a=R(11,19);b=R(1,a-10)}else{a=R(11,18);b=R(a%10+1,9)}}
  let visual=op==='+'?`${group(many(tk,a),a+' '+pf(a,t))}${sign('+')}${group(many(tk,b),b+' '+pf(b,t))}`:group([...many(tk,a-b),...many(tk,b,'x')],`${a} ${pf(a,t)}, joista ${b} syödään`);
  let hint;
  if(op==='+'){if(L<3)hint=`<p>Aloita isommasta luvusta ${Math.max(a,b)} ja laske ${Math.min(a,b)} eteenpäin.</p>`;

      hint=`<p>Täydennä ensin kymppiin: ${big} + ${fill} = 10. Toisesta luvusta jää vielä ${rest}. Paljonko on 10 + ${rest}?</p><div class="visual">${group([...many(tk,big),...many(t2,fill)],'täysi kymppi')}${group([...many(t2,rest),...many(tk,10-rest,'e')],'loput')}</div>`}}
  else{if(L===1)hint='<p>Laske hedelmät, joiden päällä ei ole ruksia.</p>';
    else if(L===2)hint=`<p>Vähennä ykkösistä: ${a%10} − ${b} = ${a%10-b}. Kymppi pysyy ennallaan.</p>`;
    else{const o=a-10,more=b-o;hint=`<p>Vähennä ensin kymppiin: ${a} − ${o} = 10. Vähennettävää on vielä ${more}. Paljonko on 10 − ${more}?</p><div class="visual">${group([...many(tk,10-more),...many(tk,more,'x')],'kymppi')}${group([...many(tk,o,'x'),...many(tk,10-o,'e')],'ykköset')}</div>`}}
  let story;
  if(word){const[K,M]=two();

      visual=`${opnd(group(many(tk,a),''),K.n,K.n+': '+a)}${opnd(group(many(tk,a-b),''),M.n,M.n+': '+(a-b))}`;

const GEN={Aino:'Ainon',Eetu:'Eetun',Siiri:'Siirin',Leo:'Leon',Venla:'Venlan',Onni:'Onnin',Helmi:'Helmin',Elias:'Eliaksen',Lilja:'Liljan','Väinö':'Väinön'};
const WITEMS=[
  {part:'karkkia',ela:'karkeista',svg:()=>UNITS.karkki.one},
  {part:'tarraa',ela:'tarroista',svg:()=>UNITS.tarra.one},
  {part:'helmeä',ela:'helmistä',svg:()=>'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="var(--plate)" stroke="var(--soft)" stroke-width="1.4"/><circle cx="9" cy="9" r="3" fill="#fff" opacity=".8"/></svg>'},
  {part:'keräilykorttia',ela:'keräilykorteista',svg:()=>'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="13" height="16" rx="2" fill="var(--blue)" opacity=".5" transform="rotate(-10 10 14)"/><rect x="7" y="3" width="13" height="17" rx="2" fill="var(--blue)"/><path d="M13.5 7.5l1.3 2.7 3 .4-2.2 2 .6 2.9-2.7-1.5-2.7 1.5.6-2.9-2.2-2 3-.4z" fill="var(--sun)"/></svg>'},
  {part:'simpukkaa',ela:'simpukoista',svg:()=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21L3.5 10a8.5 8.5 0 0 1 17 0z" fill="var(--cake)"/><path d="M12 21L7 6M12 21V4M12 21l5-15M12 21L4 10M12 21l8-11" stroke="var(--cake-edge)" stroke-width="1.2"/><rect x="9.5" y="19.5" width="5" height="3" rx="1" fill="var(--cake-edge)"/></svg>'}];
const CW={2:'kaksi',3:'kolme',4:'neljä',5:'viisi',10:'kymmenen'};
const FW={'1/2':'puolet','1/3':'kolmasosa','1/4':'neljäsosa','1/5':'viidesosa','2/3':'kaksi kolmasosaa','3/4':'kolme neljäsosaa','2/5':'kaksi viidesosaa','3/5':'kolme viidesosaa'};
const DIVW={2:'kahdella',3:'kolmella',4:'neljällä',5:'viidellä'},MULW={2:'kahdella',3:'kolmella',4:'neljällä',5:'viidellä',10:'kymmenellä'};
function wordPuzzleGen(g){return(L)=>{
  const mulBias=fam()==='mul';
  const n=L===1?2:L===2?3:(g>=5?4:3),reverse=L===3;
  const lim={1:20,2:100,3:200,4:500,5:1000,6:1000}[g];
  const v0r={1:[5,15],2:[10,60],3:[10,100],4:[20,300],5:[20,400],6:[20,500]}[g];
  const addr={1:[1,5],2:[2,20],3:[5,40],4:[10,90],5:[10,150],6:[10,200]}[g];
  const coefs=g===1?[]:g===2?[2]:g===3?[2,3,4,5]:[2,3,4,5,10];
  const fracs=g===1?[]:g===2?['1/2']:g===3?['1/2','1/3','1/4']:g===4?['1/2','1/3','1/4','1/5','2/3','3/4']:Object.keys(FW);
  const rels=['more','less'];if(coefs.length)rels.push('times');if(fracs.length)rels.push('frac');if(g>=3)rels.push('total');
  const it=pick(WITEMS);
  for(let t=0;t<1000;t++){
    const P=shuffle(KIDS).slice(0,n),vals=[R(...v0r)],steps=[];let ok=true;
    for(let i=1;i<n;i++){const x=vals[i-1];
      const mulR=rels.filter(r=>r==='times'||r==='frac'),addR=rels.filter(r=>r==='more'||r==='less'||r==='total');let pool=mulBias&&mulR.length?mulR:addR;
      const r=pick(pool);let y,s;
      if(r==='more'){const k=R(...addr);y=x+k;s={r,k}}
      else if(r==='less'){const k=R(...addr);y=x-k;s={r,k}}
      else if(r==='times'){const c=pick(coefs);y=x*c;s={r,c}}
      else if(r==='frac'){const f=pick(fracs),[a,b]=f.split('/').map(Number);if(x%b){ok=false;break}y=x/b*a;s={r,f,a,b}}
      else{y=R(...addr);if(y===x)y++;s={r,S:x+y}}

      vals.push(y);steps.push(s)}
    if(!ok)continue;
    const askTotal=L===3&&Math.random()<.5,total=vals.reduce((a,b)=>a+b,0);
    if(askTotal&&total>lim*1.5)continue;

    const calc=[`${P[0].n}: ${vals[0]}`];const why=new Set();
    steps.forEach((s,j)=>{const X=P[j],Y=P[j+1],x=vals[j],y=vals[j+1];
      if(s.r==='more'){sent.push(`${Y.ll} on ${s.k} ${it.part} enemmän kuin ${X.ll}.`);calc.push(`${Y.n}: ${x} + ${s.k} = ${y}`);why.add('<li><b>enemmän kuin</b> → lisää</li>')}
      else if(s.r==='less'){sent.push(`${Y.ll} on ${s.k} ${it.part} vähemmän kuin ${X.ll}.`);calc.push(`${Y.n}: ${x} − ${s.k} = ${y}`);why.add('<li><b>vähemmän kuin</b> → vähennä</li>')}
      else if(s.r==='times'){sent.push(`${Y.ll} on ${CW[s.c]} kertaa niin monta ${it.part} kuin ${X.ll}.`);calc.push(`${Y.n}: ${s.c} · ${x} = ${y}`);why.add(`<li><b>${CW[s.c]} kertaa niin monta</b> → kerro ${MULW[s.c]}</li>`)}
      else if(s.r==='frac'){sent.push(`${Y.ll} on ${FW[s.f]} ${GEN[X.n]} ${it.ela}.`);calc.push(`${Y.n}: ${x} : ${s.b}${s.a>1?` · ${s.a}`:''} = ${y}`);why.add(`<li><b>${FW[s.f]}</b> → jaa ${DIVW[s.b]}${s.a>1?` ja kerro ${MULW[s.a]}`:''}</li>`)}
      else{sent.push(`${X.ll} ja ${Y.ll} on yhteensä ${s.S} ${it.part}.`);calc.push(`${Y.n}: ${s.S} − ${x} = ${y}`);why.add(`<li><b>yhteensä</b> → vähennä yhteismäärästä se, minkä jo tiedät</li>`)}});

    const last=P[n-1],q=askTotal?`Montako ${it.part} heillä on yhteensä?`:`Montako ${it.part} ${last.ll} on?`;
    const ans=askTotal?total:vals[n-1];
    let ppl=P.filter((p,i)=>i>0&&(i<n-1||askTotal));if(reverse)ppl.reverse();
    const after=!ppl.length?'':`<div class="scratch"><span class="sclbl">Apuruutu${ppl.length>1?'t':''}</span>${ppl.map((p,i)=>`<span class="scit">${p.n} =<input class="num sc sw" id="sc${i}" inputmode="none" autocomplete="off" aria-label="${p.n}"></span>`).join('')}</div>`;
    const hint=(reverse?`<p>Etsi lause, jossa kerrotaan suoraan, montako ${it.part} jollakulla on. Se on tarinan lopussa. Etene siitä taaksepäin lause kerrallaan.</p>`
      :`<p>${P[0].ll} on ${vals[0]} ${it.part}. Laske sen avulla seuraavan henkilön määrä, ja jatka siitä eteenpäin.</p>`)+`<ul class="wlist">${[...why].join('')}</ul>`;
    const explain=`<ol>${calc.map(c=>`<li>${c}</li>`).join('')}${askTotal?`<li>Yhteensä: ${vals.join(' + ')} = ${total}</li>`:''}</ol>`;
    return{kind:'int',story:order.map(i=>sent[i]).join(' ')+' <b>'+q+'</b>',storyIcon:it.svg(),after:'',ans,answerText:String(ans),hint,explain}}
  return wordPuzzleGen(g)(1)}}

const degF=t=>t<0?`−${-t} °C`:t>0?`+${t} °C`:'0 °C';
const degN=t=>t<0?`−${-t}`:String(t);
function thermoScale(vals){let lo=Math.floor((Math.min(...vals)-3)/5)*5,hi=Math.ceil((Math.max(...vals)+3)/5)*5;lo=Math.min(lo,-5);hi=Math.max(hi,5);return[lo,hi]}
function thermoSVG(t,lo,hi){const top=22,bot=186,px=(bot-top)/(hi-lo),y=v=>bot-(v-lo)*px,lab=(hi-lo)<=30?5:10,ts=px>=3.5?1:2;
  let s=`<svg class="thermo" viewBox="0 0 80 236" aria-hidden="true"><rect x="4" y="3" width="72" height="230" rx="12" fill="var(--sun-bg)" stroke="var(--stem)" stroke-width="2.5"/><circle cx="40" cy="12" r="3" fill="var(--paper)" stroke="var(--stem)" stroke-width="1.5"/>`;
  for(let v=lo;v<=hi;v+=ts){const big=v%5===0,z=v===0;s+=`<line x1="${z?28:big?34:38}" y1="${y(v).toFixed(1)}" x2="44" y2="${y(v).toFixed(1)}" stroke="var(--ink)" stroke-width="${z?2:big?1.3:.8}" opacity="${big?1:.6}"/>`;
    if(v%lab===0)s+=`<text x="${z?26:32}" y="${(y(v)+3.2).toFixed(1)}" text-anchor="end" font-size="${z?10:9}" font-weight="${z?800:700}" fill="${v<0?'var(--blue)':'var(--ink)'}" font-family="Nunito, sans-serif">${degN(v)}</text>`}
  if(t!=null)s+=`<rect x="47" y="${y(t).toFixed(1)}" width="6" height="${(bot+16-y(t)).toFixed(1)}" fill="var(--apple)"/>`;
  s+=`<rect x="45" y="${top-8}" width="10" height="${bot-top+22}" rx="5" fill="none" stroke="var(--soft)" stroke-width="1.6"/><circle cx="50" cy="${bot+24}" r="12" fill="var(--apple)" stroke="var(--soft)" stroke-width="1.6"/><circle cx="46" cy="${bot+20}" r="3" fill="#fff" opacity=".5"/><text x="64" y="${top+2}" font-size="9" font-weight="800" fill="var(--soft)" font-family="Nunito, sans-serif">°C</text></svg>`;
  return s}
const thermoFig=(t,lo,hi,cap)=>opnd(thermoSVG(t,lo,hi),cap,cap+(t==null?'':': '+degF(t)));
const CITIES=[['Utsjoella','Utsjoki'],['Rovaniemellä','Rovaniemi'],['Oulussa','Oulu'],['Kuopiossa','Kuopio'],['Tampereella','Tampere'],['Helsingissä','Helsinki'],['Turussa','Turku'],['Maarianhaminassa','Maarianhamina']];
function thermoGen(g){return(L,op,word)=>{
  const M=g===3?15:g===4?25:30,h=Math.floor(M/2);
  const mode=op==='+'?'rise':op==='mit'?pick(['diff','diff','rise','drop']):pick(['diff','diff','drop']);
  if(mode==='diff'){let a,b;
    if(L===1){a=-R(1,h);b=R(1,h)}else if(L===2){a=-R(2,M);b=R(1,M)}
    else if(Math.random()<.5){a=-R(4,M);b=-R(1,-a-2)}else{a=-R(5,M);b=R(5,M)}
    if(Math.random()<.5)[a,b]=[b,a];
    const d=Math.abs(a-b),[lo,hi]=thermoScale([a,b]),cold=Math.min(a,b),warm=Math.max(a,b);
    let story=null,caps=['Aamulla','Iltapäivällä'];
    if(word){if(Math.random()<.5)story=`Aamulla lämpötila oli ${degF(a)}. Iltapäivällä mittari näytti ${degF(b)}. Kuinka monta astetta lämpötila ${b>a?'nousi':'laski'}?`;
      else{const[c1,c2]=shuffle(CITIES);caps=[c2[1],c1[1]];const wc=b>a?c1:c2;
        story=`${c2[0]} on ${degF(a)} ja ${c1[0]} ${degF(b)}. Kuinka monta astetta lämpimämpää on ${wc[0]}?`}}
    const hint=cold<0&&warm>0?`<p>Laske matka nollan kautta. Kylmemmästä lämpötilasta ${degF(cold)} on nollaan ${-cold} astetta. Nollasta lämpötilaan ${degF(warm)} on ${warm} astetta.</p><p>Laske nämä yhteen.</p>`
      :cold<0&&warm===0?`<p>Laske, montako astetta lämpötilasta ${degF(cold)} on nollaan.</p>`
      :`<p>Molemmat ovat pakkasella. Lämpimämpi on se, joka on lähempänä nollaa. Ero on ${-cold} − ${-warm}.</p>`;
    return{kind:'int',visual:`${thermoFig(a,lo,hi,caps[0])}${thermoFig(b,lo,hi,caps[1])}`,story,storyIcon:null,
      text:word?null:'<span class="bg" style="font-size:.7em">Kuinka monta astetta lämpötilat eroavat?</span>',unit:'astetta',ans:d,answerText:`${d} astetta`,hint,
      explain:`<p><b>Ero on ${d} astetta.</b></p><p>${cold<0&&warm>0?`${-cold} + ${warm} = ${d}`:`${degN(warm)} − (${degN(cold)}) = ${d}`}</p>`}}

  else{if(L===1){t0=R(1,h);k=R(t0+1,t0+h)}else if(L===2){t0=R(-h,M);k=R(1,M)}else{t0=R(-h,M);k=R(2,M)}}

    :pick([`Illalla lämpötila oli ${degF(t0)}. Yön aikana lämpötila laski ${k} astetta. Mikä oli lämpötila aamulla?`,`Iltapäivällä mittari näytti ${degF(t0)}. Illaksi lämpötila laski ${k} astetta. Mikä oli lämpötila illalla?`])):null;

  else if(!up&&t0>0&&t1<0)hint=`<p>Laske ensin nollaan: siihen tarvitaan ${t0} astetta. Laskua on jäljellä vielä ${k} − ${t0} = ${k-t0} astetta, joten mennään pakkasen puolelle.</p>`;
  else if(t0<0&&t1<0)hint=`<p>Ollaan koko ajan pakkasen puolella. ${up?'Kun lämpötila nousee, pakkasasteita tulee vähemmän.':'Kun lämpötila laskee, pakkasasteita tulee lisää.'}</p>`;
  else hint=`<p>Siirry mittarin asteikolla ${k} astetta ${up?'ylöspäin':'alaspäin'}.</p>`;
  hint+='<p>Jos vastaus on pakkasella, kirjoita alkuun miinusmerkki −.</p>';
  return{kind:'int',neg:true,visual:`${thermoFig(t0,lo,hi,up?'Alussa':'Alussa')}<span class="note">${up?'Nousee':'Laskee'} ${k} astetta</span>`,story,
    text:word?null:`<span class="bg" style="font-size:.7em">Lämpötila ${verb==='nousi'?'nousee':'laskee'} ${k} astetta. Mikä on uusi lämpötila?</span>`,
    unit:'°C',ans:t1,answerText:degF(t1),hint,
    explain:`<p><b>${degN(t0)} ${up?'+':'−'} ${k} = ${degN(t1)}</b>, eli ${degF(t1)}.</p><div class="visual">${thermoFig(t1,lo,hi,'Lopussa')}</div>`}}}

    else{const k=pick(['mul','grow','half']);if(k==='mul'){const m=pick([2,3]);rule={type:'mul',m};const a=R(1,4);terms=T(i=>a*m**i)}else if(k==='half'){rule={type:'div',m:2};const a=pick([3,5,7])*32;terms=T(i=>a/2**i)}else{rule={type:'grow'};let x=R(1,20);terms=T(i=>{const r=x;x+=2*(i+1);return r});rule.type='grow2'}}}
  else if(g===5){if(L===1){const[s,d]=pick([[5,1],[25,2],[1,1],[2,1]]);dec=d;terms=ar(R(0,40)*10**(d-1)*(d===2?5:1)/10**d,s/10**d)}

const FAMN={add:'Yhteen- ja vähennyslasku',mul:'Kerto- ja jakolasku',cmp:'Jonot',mit:'Mittaaminen',stat:'Tilastot'};
function newProblem(keep){
  if(S.op==='mix'&&!(keep&&RND)){const f=pick(['add',...(S.grade>1?['mul']:[]),'cmp','mit','stat']);RND={fam:f,type:'perus',topic:null};
    const tl=tlist();const tp=pick(tl.flatMap(t=>t.puzzle?[t]:[t,t]));RND.topic=tp.id;RND.type=pick(typesFor(tp))}
  const t=cur(),pr=prog();const op=S.op==='mix'?pick(fam()==='mul'?['*','/']:fam()==='cmp'?['cmp']:fam()==='mit'?['mit']:fam()==='stat'?['stat']:['+','-']):S.op;
  P=t.gen(pr.level,op,typ()==='sov');P.opUsed=op;tries=0;done=false;draw()}
function answerHTML(){
  if(P.kind==='col'){const L=P.L,isC=i=>L.D&&i===L.I,rng=[...Array(L.N).keys()];
    const cells=a=>rng.map(i=>`<td class="${isC(i)?'cm':''}">${a[i]}</td>`).join('');
    return `<div class="calc-wrap"><table class="calc" aria-label="Allekkainlasku"><tbody>
      <tr class="carry"><td class="sg"></td>${rng.map(i=>isC(i)?'<td class="cm"></td>':i===L.N-1?'<td></td>':`<td><input class="ci" id="c${i}" data-i="${i}" inputmode="none" maxlength="2" autocomplete="off" aria-label="Muistinumero"></td>`).join('')}</tr>
      <tr><td class="sg"></td>${cells(L.a)}</tr>
      <tr><td class="sg">${OPS[P.op]}</td>${cells(L.b)}</tr>
      ${[...Array(P.partials||0).keys()].map(r=>`<tr class="pr${r===0?' first':''}"><td class="sg"></td>${rng.map(i=>`<td><input class="pi" id="p${r}_${i}" data-r="${r}" data-i="${i}" inputmode="none" maxlength="1" autocomplete="off" aria-label="Välitulos"></td>`).join('')}</tr>`).join('')}
      <tr class="res"><td class="sg">${P.partials?'+':''}</td>${rng.map(i=>isC(i)?'<td class="cm">,</td>':`<td><input class="ri" id="r${i}" data-i="${i}" inputmode="none" maxlength="1" autocomplete="off" aria-label="Vastauksen numero"></td>`).join('')}</tr>
    </tbody></table></div>`}
  if(P.steps||P.inline||P.kind==='multi')return '';
  if(P.kind==='choice')return `<div class="choices${P.big?' big':''}${P.pics?' pics':''}" role="group" aria-label="Vastausvaihtoehdot">${P.choices.map(([v,l])=>`<button type="button" class="choice" data-choice="${v}">${l}</button>`).join('')}</div>`;
  if(P.kind==='divr')return `<div class="answer"><input class="num" id="ans" inputmode="none" autocomplete="off" aria-label="Osamäärä">${P.qLabel?`<span class="unit">${P.qLabel}</span>`:''}<span class="unit">${P.rLabel||'jakojäännös'}</span><input class="num tb" id="rem" inputmode="none" autocomplete="off" aria-label="Jakojäännös"></div>`;
  if(P.kind==='time')return `<div class="answer"><span class="unit">kello</span><input class="num tb" id="th" inputmode="none" autocomplete="off" aria-label="Tunnit"><span class="unit">.</span><input class="num tb" id="tm" inputmode="none" autocomplete="off" aria-label="Minuutit" placeholder="00"></div>${P.m12?'':'<p class="inst"><span>Käytä 24 tunnin kelloa, esimerkiksi 18.05.</span></p>'}`;
  if(P.kind==='dur')return `<div class="answer"><input class="num tb" id="th" inputmode="none" autocomplete="off" aria-label="Tunnit"><span class="unit">h</span><input class="num tb" id="tm" inputmode="none" autocomplete="off" aria-label="Minuutit"><span class="unit">min</span></div>`;
  if(P.kind==='frac')return `<div class="answer"><span class="fin"><input class="num" id="fn" inputmode="none" autocomplete="off" aria-label="Osoittaja"><span class="bar"></span><input class="num" id="fdn" inputmode="none" autocomplete="off" aria-label="Nimittäjä"></span></div>`;
  return `<div class="answer"><input class="num" id="ans" inputmode="none" autocomplete="off" aria-label="Vastaus">${P.unit?`<span class="unit">${P.unit}</span>`:''}</div>`}
function inlineAns(){if(P.steps||P.inline||!P.text||!P.text.includes(BOX)||!['int','dec','frac'].includes(P.kind))return null;
  if(P.kind==='frac')return `<span class="fin xin"><input class="num" id="fn" inputmode="none" autocomplete="off" aria-label="Osoittaja"><span class="bar"></span><input class="num" id="fdn" inputmode="none" autocomplete="off" aria-label="Nimittäjä"></span>`;
  const w=Math.max(3,String(P.ans).length+1);
  return `<input class="num xin" id="ans" style="width:${w+1}ch" inputmode="none" autocomplete="off" aria-label="Vastaus">`}
function draw(){const t=cur(),pr=prog();const IA=inlineAns();
  $('#sheet').innerHTML=`
    ${S.op==='mix'?`<p class="mixlbl">${t.puzzle?`${t.name} · ${FAMN[fam()].toLowerCase()}`:`${FAMN[fam()]} · ${t.name}${typ()==='sov'?' · sanallinen':''}`}</p>`:''}
    <div class="status">
      <div class="levels" role="group" aria-label="Taso"><span class="stlbl">Taso</span>${[1,2,3].map(l=>`<button type="button" class="lv" data-level="${l}" aria-pressed="${l===pr.level}" aria-label="Taso ${l}">${l}</button>`).join('')}<span class="lvname">${(ln=>typeof ln==='object'?ln[P.opUsed]||ln['*']:ln)(t.levels[pr.level-1])}</span></div>
      <div class="streak" id="streak">${streakHTML()}</div>
    </div>
    ${P.visual?`<div class="visual">${P.visual}</div>`:''}
    ${P.story?`<div class="story">${P.storyIcon?`<span class="sicon" aria-hidden="true">${P.storyIcon}</span>`:''}<p>${P.story}</p></div>`:''}
    ${P.text?`<div class="expr">${IA?P.text.replace(BOX,IA):P.text}</div>`:''}
    ${P.after||''}
    ${P.kind==='col'?'<p class="inst"><span>Laske allekkain. Aloita oikealta.</span></p>':''}
    ${IA?'':answerHTML()}
    ${(kp=>`<div class="kpwrap${kp?' side':''}">${kp}`)(keypad())}
    <div class="actions">
      <button type="button" class="btn" id="check"${P.kind==='choice'?' hidden':''}>Tarkista</button>
      <button type="button" class="btn ghost" id="hintBtn">Vihje</button>
      <button type="button" class="btn ghost" id="skip">Seuraava</button>
      <button type="button" class="btn next" id="next" hidden>Seuraava tehtävä →</button>
    </div></div>
    <div id="fb" hidden></div>
    <div class="panel" id="hint" hidden><h3>Vihje</h3>${P.hint}</div>
    <div class="panel explain" id="explain" hidden><h3>Näin se lasketaan</h3>${P.explain}</div>`;
  const first=P.steps?$('#sc0'):P.kind==='col'?document.getElementById('r'+(P.L.N-1)):document.querySelector('#ans,#fn,#th');
  activeEl=first;if(first)first.focus({preventScroll:true})}
function fb(msg,cls){const e=$('#fb');e.hidden=false;e.className='fb '+cls;e.innerHTML=msg}
function evaluate(){
  if(P.kind==='int'||P.kind==='dec'){const el=$('#ans');const s=el.value.replace(/[\s ]/g,'').replace(',','.').replace('−','-');
    if(!s)return{empty:true};if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return{bad:'Kirjoita vastaukseksi luku, esimerkiksi 12 tai 3,5.'};
    const ok=Math.abs(parseFloat(s)-P.ans)<1e-9;el.classList.toggle('ok',ok);el.classList.toggle('no',!ok);return{ok}}
  if(P.kind==='multi'){const sel=[...document.querySelectorAll('.gtile[aria-pressed="true"]')].map(b=>+b.dataset.pick);if(!sel.length)return{empty:true};
    const ok=sel.length===P.ans.length&&sel.every(i=>P.ans.includes(i));document.querySelectorAll('.gtile').forEach(b=>{b.classList.remove('ok','no');const i=+b.dataset.pick;if(b.getAttribute('aria-pressed')==='true')b.classList.add(P.ans.includes(i)?'ok':'no')});
    if(!ok){const miss=P.ans.filter(i=>!sel.includes(i)).length,extra=sel.filter(i=>!P.ans.includes(i)).length;P.multiMsg=extra?'Osa valinnoista ei kuulu joukkoon. Ne on merkitty punaisella.':`Löysit jo osan. Vielä ${miss} puuttuu.`}return{ok}}
  if(P.kind==='choice'){if(P.sel==null)return{empty:true};const ok=P.sel===P.ans;document.querySelectorAll('.choice').forEach(b=>{b.classList.remove('ok','no');if(b.dataset.choice===P.sel)b.classList.add(ok?'ok':'no')});return{ok}}
  if(P.kind==='divr'){const qs=$('#ans').value.trim(),rs=$('#rem').value.trim();if(!qs)return{empty:true};
    if(!/^\d+$/.test(qs)||!/^\d*$/.test(rs))return{bad:'Kirjoita vastaukseen kokonaisluvut.'};
    const ok=+qs===P.ans&&+(rs||0)===P.rem;['#ans','#rem'].forEach(s=>{$(s).classList.toggle('ok',ok);$(s).classList.toggle('no',!ok)});return{ok}}
  if(P.kind==='time'||P.kind==='dur'){const hs=$('#th').value.trim(),ms=$('#tm').value.trim();if(!hs&&!ms)return{empty:true};
    if(!/^\d*$/.test(hs)||!/^\d*$/.test(ms))return{bad:'Kirjoita tunnit ja minuutit numeroina.'};
    const h=+(hs||0),m=+(ms||0);if(P.kind==='time'&&m>59)return{bad:'Minuutteja voi olla korkeintaan 59.'};
    let ok;if(P.kind==='dur')ok=h*60+m===P.ans;else{const ah=Math.floor(P.ans/60),am=P.ans%60;ok=m===am&&(P.m12?h%12===ah%12:h===ah)}
    ['#th','#tm'].forEach(s=>{$(s).classList.toggle('ok',ok);$(s).classList.toggle('no',!ok)});return{ok}}
  if(P.kind==='frac'){const n=$('#fn').value.trim(),d=$('#fdn').value.trim();if(!n)return{empty:true};
    if(!/^\d+$/.test(n)||(d&&!/^\d+$/.test(d)))return{bad:'Kirjoita osoittajaan ja nimittäjään kokonaisluvut.'};
    const nn=+n,dd=d?+d:1;if(dd===0)return{bad:'Nimittäjä ei voi olla 0.'};
    const ok=nn*P.ans.d===P.ans.n*dd;['#fn','#fdn'].forEach(s=>{$(s).classList.toggle('ok',ok);$(s).classList.toggle('no',!ok)});return{ok}}
  const L=P.L,ins=[...document.querySelectorAll('.ri')],v={};ins.forEach(x=>v[+x.dataset.i]=x.value.trim());
  if(ins.every(x=>!x.value.trim()))return{empty:true};
  let ip='',seen=false,bad=false;for(let i=0;i<L.I;i++){const c=v[i];if(c===''){if(seen)bad=true}else{seen=true;ip+=c}}
  let dp='';if(L.D){const ds=[];for(let i=L.I+1;i<L.N;i++)ds.push(v[i]);while(ds.length&&ds[ds.length-1]==='')ds.pop();if(ds.includes(''))bad=true;dp=ds.join('')}
  if(bad||!/^\d*$/.test(ip+dp))return{bad:'Täytä ruudut ilman välejä. Kirjoita yksi numero jokaiseen ruutuun.'};
  const num=parseFloat((ip||'0')+(dp?'.'+dp:''));const ok=Math.round(num*10**L.D)===L.ansU;
  ins.forEach(x=>{const i=+x.dataset.i,e=L.r[i],c=x.value.trim();
    const cellOk=ok?true:(c===e||(c===''&&e==='0'&&i>L.I)||(c==='0'&&e==='')||(c===''&&e===''));
    x.classList.remove('ok','no');if(c!==''||e!=='')x.classList.add(cellOk?'ok':'no')});
  return{ok}}
const PRAISE=['Oikein!','Hienoa!','Mahtavaa!','Juuri niin!','Loistavaa!','Hyvin laskettu!'];
function check(){if(done)return;const r=evaluate(),pr=prog();
  if(r.empty){fb('Kirjoita ensin vastaus.','info');return}
  if(r.bad){fb(r.bad,'info');return}
  if(r.ok){done=true;S.stars++;pr.streak++;pr.fails=0;let msg=pick(PRAISE)+' Sait tähden.';
    if(pr.streak>=3&&pr.level<3){pr.level++;pr.streak=0;msg+=` Siirryt tasolle ${pr.level}.`}
    else if(pr.streak>=3){pr.streak=0;msg+=' Olet ylimmällä tasolla. Upeaa!'}
    fb(msg,'good');const st=$('#stars');st.classList.remove('pop');void st.offsetWidth;st.classList.add('pop');$('#starN').textContent=S.stars;finish()}
  else{tries++;
    if(tries===1){fb(P.kind==='multi'&&P.multiMsg?P.multiMsg:'Ei vielä ihan. Tarkista vastaus tai katso vihje.','bad')}
    else{done=true;pr.streak=0;pr.fails++;let msg=P.answerText?`Oikea vastaus on ${P.answerText}.`:'Oikea vaihtoehto on merkitty vihreällä.';if(P.kind==='choice'){const cb=document.querySelector(`.choice[data-choice="${P.ans}"]`);if(cb)cb.classList.add('ok')}if(P.kind==='multi')P.ans.forEach(i=>{const t=document.querySelector(`.gtile[data-pick="${i}"]`);if(t&&!t.classList.contains('ok'))t.classList.add('miss')});
      if(pr.fails>=2&&pr.level>1){pr.level--;pr.fails=0;msg+=' Harjoitellaan välillä vähän helpompia.'}
      fb(msg,'bad');$('#explain').hidden=false;$('#hint').hidden=true;
      if(P.kind==='col'&&(P.op==='+'||P.op==='*'))P.carries.forEach(x=>{const i=typeof x==='object'?x.i:x,v=typeof x==='object'?x.v:1;const c=document.getElementById('c'+i);if(c&&!c.value){c.value=String(v);c.classList.add('hinted')}});
      finish()}}
  updateStreak();save()}
function finish(){const kp=$('.keypad');if(kp)kp.hidden=true;$('#check').hidden=true;$('#skip').hidden=true;$('#hintBtn').hidden=$('#hint').hidden;const n=$('#next');n.hidden=false;n.focus({preventScroll:true})}
function streakHTML(){const pr=prog();
  if(pr.level>=3)return `<span>Ylin taso</span>`;
  return `<span>Seuraavalle tasolle:</span>${[0,1,2].map(i=>`<i class="${i<pr.streak?'on':''}"></i>`).join('')}<span class="sr">${3-pr.streak} oikein peräkkäin puuttuu</span>`}
function updateStreak(){const e=$('#streak');if(e)e.innerHTML=streakHTML()}

/* ---------- numeronäppäimistö ---------- */
let activeEl=null;
const BACK='<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9l5 6M17 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function keypad(){
  if(P.kind==='choice'||P.kind==='multi')return '';
  if(P.neg&&P.kind==='dec')return `<div class="keypad" role="group" aria-label="Numeronäppäimistö">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key" data-key="${n}">${n}</button>`).join('')}<button type="button" class="key alt" data-key="neg" aria-label="Miinusmerkki">−</button><button type="button" class="key" data-key="0">0</button><button type="button" class="key" data-key="," aria-label="Pilkku">,</button><button type="button" class="key alt wide" data-key="back" aria-label="Pyyhi">${BACK}</button></div>`;
  const last=P.neg?'<button type="button" class="key alt" data-key="neg" aria-label="Miinusmerkki">−</button>':P.kind==='dec'?'<button type="button" class="key" data-key="," aria-label="Pilkku">,</button>'
    :P.kind==='frac'?'<button type="button" class="key alt" data-key="swap" aria-label="Vaihda osoittajan ja nimittäjän välillä">↕</button>'
    :(P.steps||P.kind==='time'||P.kind==='dur'||P.kind==='divr')?'<button type="button" class="key alt" data-key="swap" aria-label="Seuraava ruutu">→</button>':'<span></span>';
  return `<div class="keypad" role="group" aria-label="Numeronäppäimistö">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="key" data-key="${n}">${n}</button>`).join('')}${last}<button type="button" class="key" data-key="0">0</button><button type="button" class="key alt" data-key="back" aria-label="Pyyhi">${BACK}</button></div>`}
function pressKey(k){if(done)return;
  let el=activeEl&&document.body.contains(activeEl)?activeEl:null;
  if(!el)el=P.kind==='col'?document.getElementById('r'+(P.L.N-1)):document.querySelector('#ans,#fn,#th');
  if(!el)return;
  const fire=()=>el.dispatchEvent(new Event('input',{bubbles:true}));
  if(k==='swap'){const f=P.steps?[...document.querySelectorAll('.step1 .sc'),$('#ans')]:[...document.querySelectorAll('.answer .num')];const i=f.indexOf(el);el=P.steps?f[Math.min(i+1,f.length-1)]:f[(i+1)%f.length]}
  else if(k==='back'){
    if(el.classList.contains('ri')&&!el.value){let j=+el.dataset.i+1;if(P.L.D&&j===P.L.I)j++;const n=document.getElementById('r'+j);if(n)el=n}
    el.value=el.value.slice(0,-1);el.classList.remove('ok','no');if(!el.classList.contains('ri'))fire()}
  else if(k==='neg'){if(el.id==='ans'){el.value=el.value.startsWith('−')||el.value.startsWith('-')?el.value.slice(1):'−'+el.value;fire()}}
  else if(k===','){if(el.id==='ans'&&!el.value.includes(','))el.value+=(el.value?'':'0')+',';}
  else if(el.classList.contains('ri')||el.classList.contains('ci')||el.classList.contains('pi')){el.value=k;fire();if(!el.classList.contains('ci'))return}
  else if(el.classList.contains('tb')){if(el.value.length<2){el.value+=k;fire()}if(el.id==='th'&&el.value.length===2)el=$('#tm')}
  else if(el.value.replace(/\D/g,'').length<9){el.value+=k;fire()}
  activeEl=el;el.focus({preventScroll:true})}
document.addEventListener('focusin',e=>{if(e.target.matches('.num,.ri,.ci,.pi'))activeEl=e.target});
document.addEventListener('pointerdown',e=>{if(e.target.closest('.key'))e.preventDefault()});
document.addEventListener('mousedown',e=>{if(e.target.closest('.key'))e.preventDefault()});

/* ---------- tapahtumat ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.help){const h=$('#pzh');h.hidden=!h.hidden;b.setAttribute('aria-expanded',String(!h.hidden));b.setAttribute('aria-label',h.hidden?'Näytä ohje':'Piilota ohje');return}
  if(b.dataset.turn){const f=$('#sheet .visual .arr'),ex=$('#sheet .ex');if(!f||!ex)return;const t=f.classList.toggle('tr'),A=+f.dataset.a,B=+f.dataset.b;ex.textContent=t?`${B} · ${A}`:`${A} · ${B}`;return}
  if(b.dataset.grade){S.grade=+b.dataset.grade;renderControls();newProblem();save()}
  else if(b.dataset.topic){S.topic[S.grade+fam()]=b.dataset.topic;renderControls();newProblem();save()}
  else if(b.dataset.op){S.op=b.dataset.op;if(S.op==='+'||S.op==='-')S.fam='add';else if(S.op==='cmp')S.fam='cmp';else if(S.op!=='mix')S.fam='mul';renderControls();newProblem();save()}
  else if(b.dataset.type){S.type=b.dataset.type;renderControls();newProblem();save()}
  else if(b.dataset.level){const pr=prog();pr.level=+b.dataset.level;pr.streak=0;pr.fails=0;newProblem(true);save()}
  else if(b.dataset.pick!=null){if(done)return;b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));b.classList.remove('ok','no')}
  else if(b.dataset.sim){simRun(+b.dataset.sim);return}
  else if(b.dataset.simreset){SIM.counts={};SIM.n=0;SIM.cap=25;SIM.mode=null;SIM.batches=0;simUpdate();simBtns();return}
  else if(b.dataset.choice!=null){if(done)return;P.sel=b.dataset.choice;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));check()}
  else if(b.dataset.key)pressKey(b.dataset.key);
  else if(b.id==='check')check();
  else if(b.id==='hintBtn'){const h=$('#hint');h.hidden=!h.hidden;b.textContent=h.hidden?'Vihje':'Piilota vihje'}
  else if(b.id==='next'||b.id==='skip')newProblem()});
document.addEventListener('keydown',e=>{const t=e.target;
  if(e.key==='Enter'&&t.matches('input')){e.preventDefault();if(done)newProblem();else check();return}
  if(!t.classList||!t.classList.contains('ri'))return;
  const i=+t.dataset.i,go=j=>{let k=j;if(P.L.D&&k===P.L.I)k+=(j>i?1:-1);const el=document.getElementById('r'+k);if(el){el.focus();el.select()}};
  if(e.key==='Backspace'&&!t.value){e.preventDefault();go(i+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}});
function updSteps(){if(!P||!P.steps)return;const s1=$('.step1'),q=$('.qbox');if(!s1||!q)return;
  const filled=[...s1.querySelectorAll('.sc')].every(i=>i.value.trim());const was=q.classList.contains('active');
  s1.classList.toggle('active',!filled);q.classList.toggle('active',filled);
  if(filled&&!was&&activeEl&&activeEl.classList.contains('sc')){const a=$('#ans');if(a){activeEl=a;a.focus({preventScroll:true})}}}
document.addEventListener('input',e=>{const t=e.target;setTimeout(updSteps,0);
  if(t.classList.contains('ri')){t.value=t.value.replace(/\D/g,'').slice(-1);t.classList.remove('ok','no');
    if(t.value){let k=+t.dataset.i-1;if(P.L.D&&k===P.L.I)k--;const el=document.getElementById('r'+k);if(el){el.focus();el.select()}}}
  else if(t.classList.contains('pi')){t.value=t.value.replace(/\D/g,'').slice(-1);if(t.value){const el=document.getElementById(`p${t.dataset.r}_${+t.dataset.i-1}`);if(el){el.focus();el.select()}}}
  else if(t.classList.contains('ci')){t.value=t.value.replace(/[^\d−-]/g,'').slice(0,2);t.classList.remove('hinted')}
  else if(t.matches('.num'))t.classList.remove('ok','no')});

renderControls();newProblem();
</script>
